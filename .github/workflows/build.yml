name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            **/META-INF/MANIFEST.MF
            .mvn/wrapper/maven-wrapper.properties
      - name: Verify pinned Maven and Java versions
        run: ./mvnw --version
      - name: Verify plugin and Eclipse integration tests
        run: xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress verify
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: |
            tests/target/surefire-reports/
            navigation-tests/target/surefire-reports/
            merge-tests/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
      - name: Assemble Pages and update site
        run: python3 scripts/build_pages.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: eclipse-update-site
          path: repository/target/*.zip
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
